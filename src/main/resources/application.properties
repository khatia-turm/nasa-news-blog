spring.application.name=nasa_blog

# File-based H2 database. News posts remain available after an application restart.
spring.datasource.url=jdbc:h2:file:./data/nasa-blog
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# In-memory caches used by NewsService.
spring.cache.type=simple
spring.cache.cache-names=newsList,newsById

# Expose the public health check and ADMIN-only application information.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=NASA Blog
info.app.description=NASA news publishing application
info.app.version=1.0

# Log the current number of posts every five minutes.
news.statistics.interval-ms=300000
news.statistics.initial-delay-ms=10000

# Default log level for application classes in this package
logging.level.com.github.khatiaturm.nasa_blog=INFO

# Keep framework noise lower than application logs
logging.level.org.springframework=WARN

# Console log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] [%logger{36}] - %msg%n

# File logging configuration
logging.file.name=logs/nasa-blog.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] [%logger{36}] - %msg%n
