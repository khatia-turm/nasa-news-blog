services:
  nasa-blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nasa-blog
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/nasa-blog
      LOGGING_FILE_NAME: /app/logs/nasa-blog.log
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
